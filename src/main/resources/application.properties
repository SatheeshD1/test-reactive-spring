spring.application.name=test-reactive-spring
server.port=8080


spring.r2dbc.url=r2dbc:postgresql://localhost:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=admin@1234

spring.sql.init.mode=always
logging.level.org.springframework.r2dbc=DEBUG

spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=POST,GET
spring.graphql.sse.path=/graphql/stream
spring.graphql.websocket.path=/graphql

hazelcast.client.cluster-name=dev-cluster
hazelcast.client.network.cluster-members=127.0.0.1:5701

#hazelcast.security.username=admin
#hazelcast.security.password=password

#logging.file.name=C:/Users/Satheesh.Dharmalinga/OneDrive - InfoVision, Inc/SATHEESHD/WORKSPACE/LOGS/elk.log


# Kafka Producer properties
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

message.topic=test-topic

management.endpoints.web.exposure.include=mappings

search.query=select * from employee

update.query=update txn_data set amount=:amount,status=:status where uetr=:uetr;

